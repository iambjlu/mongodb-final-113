<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>待辦事項</title>
    
  <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-blue.min.css">
  <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
  </head>
  <body oncontextmenu="return false;">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>

        function nonSupportedBrowser() {
            document.getElementById('nonSupportedBrowser').style.display = "inline";
            alert("我們發現您使用的是不相容或過時的瀏覽器。\n為確保使用體驗，建議使用下列瀏覽器進行瀏覽:\n\n- Safari (版本16以上)\n- Google Chrome (版本79以上)\n- Microsoft Edge (版本79以上)\n- Brave (版本1.12以上)\n- 其他基於 Chromium (版本79以上)打造的瀏覽器");
        }

        function outdatedBrowser() {
            document.getElementById('outdatedBrowser').style.display = "inline";
            alert("我們發現您使用的是過時的瀏覽器。\n為確保使用體驗，建議更新瀏覽器版本。");
        }

        let userAgent = window.navigator.userAgent;
        if ((userAgent.indexOf("EdgiOS/") !== -1) && parseFloat(userAgent.substring(userAgent.indexOf("Version/") + 8), 10) >= 16.0) {
            } else if (userAgent.indexOf("MSIE") !== -1 || userAgent.indexOf("Trident") !== -1 || userAgent.indexOf("Edge") !== -1 || userAgent.indexOf("Firefox") !== -1) {
                nonSupportedBrowser();
            } else if (((userAgent.indexOf("Macintosh") !== -1) && (userAgent.indexOf("Gecko) Version/") !== -1) && parseFloat(userAgent.substring(userAgent.indexOf("Gecko) Version/") + 15), 10) < 16.0) || (userAgent.indexOf("Chrome/") !== -1) && parseInt(userAgent.substring(userAgent.indexOf("Chrome/") + 7), 10) < 79.0) {
                outdatedBrowser();
            }

        //檢查用戶用的是什麼設備
        if (window.innerWidth >= window.innerHeight && window.innerWidth > 1024 && !/Android|iPhone|iPad|iPod/i.test(userAgent)) {
                // Mac, PC
            } else {
                // Mobile, PC(窄視窗), Mac(窄視窗)
                if ((userAgent.includes("Macintosh") && window.innerWidth > 430) || (userAgent.includes("Android") && window.innerWidth > 500) || userAgent.includes("iPad") || userAgent.includes("Windows")) {
                    //iPad, Android Tab, Galaxy Z Fold Series, PC(窄視窗), Mac(窄視窗)
                    // alert("建議使用App，獲得更好的使用體驗！");
                } else {
                    //iPhone, iPod, Android Phone
                    alert("建議使用App，獲得更好的使用體驗！");
                }
            }

      //禁止拖動
      document.addEventListener("dragstart", function (e) {
            e.preventDefault();
        });

        //禁用部分組合
        document.addEventListener("keydown", function(e) {
            // F12
            if (e.keyCode == 123) {
                e.preventDefault();
                // Ctrl+Shift+I
            } else if (e.ctrlKey && e.shiftKey && e.keyCode == 73) {
                e.preventDefault();
                // Shift+F10
            } else if (e.shiftKey && e.keyCode == 121) {
                e.preventDefault();
                // Ctrl+U
            } else if (e.ctrlKey && e.keyCode == 85) {
                e.preventDefault();
                // Command+Option+I
            } else if (e.metaKey && e.altKey && e.keyCode == 73) {
                e.preventDefault();
            }
        });

        //動態頁面標題
        const OriginTitle = document.title;
        let titleTime;
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                document.title = 'O_O 頁面已隱藏 - ' + OriginTitle;
                titleTime = setTimeout(function () {
                    document.title = OriginTitle;
                }, 1500);
                //  clearTimeout(titleTime);
            }
            else {
                document.title = 'ヾ(Ő∀Ő3)ノ歡迎回來！ - ' + OriginTitle;
                titleTime = setTimeout(function () {
                    document.title = OriginTitle;
                }, 1500);
            }
        });


        //禁止雙擊縮放
        let lastTouchEndTime = 0;
        document.addEventListener('touchend', (event) => {
            const now = new Date().getTime();
            if ((now - lastTouchEndTime) <= 300) {      // 偵測時間差是否小於 300ms
                event.preventDefault();
            }
            lastTouchEndTime = now;
        }, false);

        // [Safari only] gesturestart event: multi finger gestures touching
        document.addEventListener('gesturestart', function (event) {
            // 阻止兩指縮放畫面
            event.preventDefault();
        });
    </script>
  </body>
</html>
